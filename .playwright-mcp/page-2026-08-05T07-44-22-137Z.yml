          - text: chapter).
        - heading "② Content Engine — produce" [level=3] [ref=e368]
        - paragraph [ref=e369]:
          - text: The Content Engine takes
          - strong [ref=e370]: many source channels
          - text: "and normalises them into one pipeline:"
          - strong [ref=e371]: feeds and newsletters
          - text: (RSS/Atom, release notes, monitored sites),
          - strong [ref=e372]: conference and event material
          - text: (session catalogs, slides, proceedings — a flagship channel with its own ingestion path from catalog discovery through transcripts and summaries to navigation wiring),
          - strong [ref=e373]: meetings and talks
          - text: (transcripts, recordings, notes),
          - strong [ref=e374]: deep sources
          - text: (papers, industry reports, vendor documentation), and
          - strong [ref=e375]: your own work
          - text: (notes, experiments, and the corrections you make when a model is wrong). Non-public material among these is resolved from an external mirror and read in place — never copied into the public repository.
        - paragraph [ref=e376]:
          - text: What comes out is
          - strong [ref=e377]: governed Markdown
          - text: — Markdown carrying the Hub's dual-metadata contract (identity frontmatter + validation tracking) and passing its quality model. Today it covers
          - strong [ref=e378]: article writing
          - text: and
          - strong [ref=e379]: prompt engineering
          - text: (create, validate, cross-reference, gap-analyse, publish-gate). Its productized name is
          - strong [ref=e380]: IQPilot
          - text: — "a quality assurance tool for written content, like a linter for documentation." The same engine generalizes to
          - strong [ref=e381]: generated content
          - text: ": reference documentation from code, documentation sites from a whole repository, and validation reports — each simply another Markdown producer the platform renders (see"
          - link "Platform and consumers" [ref=e382] [cursor=pointer]:
