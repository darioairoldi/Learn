              - cell [ref=f1e337]:
                - emphasis [ref=f1e338]: compound
              - cell [ref=f1e339]:
                - text: The
                - strong [ref=f1e340]: self-updating engine and autonomous streams
                - text: that keep the corpus fresh and compound the owner's judgment, under human governance.
        - paragraph [ref=f1e341]:
          - text: Two elements in the diagram are
          - strong [ref=f1e342]: not
          - text: "layers — they cut across all three:"
        - list [ref=f1e343]:
          - listitem [ref=f1e344]:
            - strong [ref=f1e345]: Sources
            - text: are the raw material the Content Engine normalises. Feeds, newsletters, conference catalogs, meeting transcripts, papers, and your own corrections all enter the
            - emphasis [ref=f1e346]: same
            - text: pipeline; none of them is a special case with its own bespoke machinery. That generality is the
            - code [ref=f1e347]: generalized-content-engine
            - text: principle.
          - listitem [ref=f1e348]:
            - strong [ref=f1e349]: The metadata spine
            - text: is what makes the Hub governable rather than merely stored. Folder metadata drives navigation, article dual metadata carries identity and validation state, and vision metadata carries the
            - strong [ref=f1e350]: invariants
            - text: —
            - code [ref=f1e351]: goal
            - text: ","
            - code [ref=f1e352]: scope
            - text: ","
            - code [ref=f1e353]: boundaries
            - text: ", and the"
            - code [ref=f1e354]: "principles:"
            - text: block with each principle's priority and rationale. The self-updating engine reads exactly this metadata to decide what it may change. One vocabulary governs navigation, quality tracking, and self-update alike.
        - heading "① Platform — deliver" [level=3] [ref=f1e355]
        - paragraph [ref=f1e356]:
          - text: The Learning Hub is delivered as a
          - strong [ref=f1e357]: fully dynamic Markdown-rendering application
          - text: (
          - code [ref=f1e358]: src/Learn.Web
          - text: ). It renders Markdown → HTML
          - strong [ref=f1e359]: on demand at request time
          - text: and builds its navigation
          - strong [ref=f1e360]: at runtime
          - text: from the live content hierarchy. There is
          - strong [ref=f1e361]: no build step and no static output
          - text: — publishing collapses to
          - emphasis [ref=f1e362]: "\"make the Markdown available.\""
          - text: Content comes from the filesystem (development) or object storage (production), chosen by configuration, so the same application serves a local clone or a hosted corpus without code changes.
        - paragraph [ref=f1e363]:
          - text: Because a page is a pure function of
          - emphasis [ref=f1e364]: its own
          - text: Markdown plus a shared shell, the platform is
          - strong [ref=f1e365]: producer- and source-agnostic
          - text: ": any Markdown, from any origin, renders live. That property is what lets the platform serve audiences far beyond a single learner (see"
          - link "Audiences" [ref=f1e366] [cursor=pointer]:
            - /url: "#-audiences-and-interaction-surfaces"
          - text: and the
          - link "Platform and consumers" [ref=f1e367] [cursor=pointer]:
            - /url: /06.00-idea/learning-hub/04-platform-and-consumers
          - text: chapter).
        - heading "② Content Engine — produce" [level=3] [ref=f1e368]
        - paragraph [ref=f1e369]:
          - text: The Content Engine takes
          - strong [ref=f1e370]: many source channels
          - text: "and normalises them into one pipeline:"
