                - strong [ref=f1e329]: ② Content Engine
              - cell [ref=f1e330]:
                - emphasis [ref=f1e331]: produce
              - cell [ref=f1e332]:
                - text: The prompts and agents that
                - strong [ref=f1e333]: turn many sources into governed Markdown
                - text: — learning notes, article writing, prompt engineering, and generated reference / documentation / validation content.
            - row [ref=f1e334]:
              - cell [ref=f1e335]:
