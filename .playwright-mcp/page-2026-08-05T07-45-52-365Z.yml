        - heading "🧭 Vision — what it is and why" [level=2] [ref=f1e257]
        - paragraph [ref=f1e258]:
          - text: Most learning is
          - strong [ref=f1e259]: consume-and-forget
          - text: ": you read an article, watch a talk, skim a paper — and the understanding fades. The Learning Hub replaces that with"
          - strong [ref=f1e260]: develop-and-keep
          - text: . It turns the information you meet into a
          - strong [ref=f1e261]: living body of knowledge you own and that keeps getting richer
          - text: ", and pairs it with an AI that learns your goals — so that learning stops being a race to keep up and becomes a way to"
          - strong [ref=f1e262]: think ahead
          - text: .
        - paragraph [ref=f1e263]: "It rests on five moves:"
        - list [ref=f1e264]:
          - listitem [ref=f1e265]:
            - paragraph [ref=f1e266]:
              - strong [ref=f1e267]:
                - mark [ref=f1e268]: Gather
              - text: "— bring what you learn from many sources into one place: feeds, papers, transcripts, event proceedings, and your own notes, normalized into a single corpus."
          - listitem [ref=f1e269]:
            - paragraph [ref=f1e270]:
              - strong [ref=f1e271]:
                - mark [ref=f1e272]: Keep
              - text: — nothing is read once and discarded; every worthwhile piece becomes part of a growing store you control.
          - listitem [ref=f1e273]:
            - paragraph [ref=f1e274]:
              - strong [ref=f1e275]:
                - mark [ref=f1e276]: Enrich
              - text: — with AI's help, each piece is
              - emphasis [ref=f1e277]: developed
              - text: ", not merely stored: analysed, connected to what you already know, organised for clarity, checked for gaps and stale facts, and kept fresh. Learning does not stop at the first read."
          - listitem [ref=f1e278]:
            - paragraph [ref=f1e279]:
              - strong [ref=f1e280]:
                - mark [ref=f1e281]: Learn in context
              - text: — the Hub is a
              - strong [ref=f1e282]: place to learn
              - text: .
              - emphasis [ref=f1e283]: You
              - text: do the active thinking — critical analysis and creative development — while
              - emphasis [ref=f1e284]: AI works alongside you
              - text: ", gathering, curating, developing, and validating. The corpus itself becomes the context that makes both your questions and the AI's help sharper."
          - listitem [ref=f1e285]:
            - paragraph [ref=f1e286]:
              - strong [ref=f1e287]:
                - mark [ref=f1e288]: Think ahead
              - text: — Gathering, keeping, and enriching aren't about a tidy archive; they're about
              - strong [ref=f1e289]: foresight
              - text: . As the corpus grows and the AI learns your goals, your scope, and how you reason, the Hub helps you get
              - emphasis [ref=f1e290]: in front
              - text: "of the flow: it turns fresh news and information into implications for"
              - strong [ref=f1e291]: you
              - text: ", surfaces what matters early, and exposes your"
              - strong [ref=f1e292]: knowledge gaps
              - text: before they bite. Each cycle leaves you thinking further ahead — not just better informed. That compounding foresight is the Learning Hub's core value.
        - paragraph [ref=f1e293]:
          - strong [ref=f1e294]: Why keep it close.
          - text: The judgment you generate while learning — your corrections, your standards, your sense of what "good" looks like — is itself valuable, and by default it flows outward to whoever owns the model you used. The Learning Hub is built so that value stays inside a boundary
          - emphasis [ref=f1e295]: you
          - text: control, free to compound. This economic case —
          - emphasis [ref=f1e296]: own your loop
          - text: — is argued in
          - link "Own your learning loop" [ref=f1e297] [cursor=pointer]:
            - /url: /06.00-idea/learning-hub/05-own-your-learning-loop
          - text: ", which adapts its vocabulary (Control, Capability, Choice, Cost, Compound, and the \"information exhaust\" it keeps) from the"
          - link "Reverse Information Paradox" [ref=f1e298] [cursor=pointer]:
            - /url: /01.00-news/20260716.01-reverse-paradox/overview
          - text: essay. It is the
          - emphasis [ref=f1e299]: rationale
          - text: for owning the Hub — not the whole of what the Hub is.
        - blockquote [ref=f1e300]:
          - paragraph [ref=f1e301]:
            - strong [ref=f1e302]: Nine folders, three layers.
            - text: The sibling folders under
            - link "06.00-idea/" [ref=f1e303] [cursor=pointer]:
              - /url: /_content-raw/06.00-idea
            - text: can read like nine separate projects. They are not — each is a component of one of the three layers described next. The
            - link "map" [ref=f1e304] [cursor=pointer]:
              - /url: "#%EF%B8%8F-the-map--sibling-visions-as-chapters"
            - text: shows which is which.
        - separator [ref=f1e305]
        - heading "🏗️ How it works — one system in three layers" [level=2] [ref=f1e306]
        - paragraph [ref=f1e307]:
          - text: The Learning Hub delivers that vision as
          - strong [ref=f1e308]: one system in three layers
          - text: ", fed by"
          - strong [ref=f1e309]: many sources
          - text: and governed throughout by
          - strong [ref=f1e310]: metadata carried on the content itself
          - text: ":"
        - generic [ref=f1e311]: "flowchart LR subgraph SRC[\"Sources — what you meet\"] direction TB S1[\"Feeds and newsletters<br/>RSS/Atom, release notes\"] S2[\"Conferences and events<br/>catalogs, slides, proceedings\"] S3[\"Meetings and talks<br/>transcripts, recordings, notes\"] S4[\"Deep sources<br/>papers, reports, vendor docs\"] S5[\"Your own work<br/>notes, experiments, corrections\"] end subgraph ENGINE[\"② Content Engine — produce\"] direction TB ING[\"Ingest and normalise<br/>extract, dedupe, score relevance\"] DEV[\"Develop<br/>analyse, connect, structure by taxonomy\"] VAL[\"Validate<br/>claims, references, quality gates\"] ING --> DEV --> VAL end subgraph PLAT[\"① Platform — deliver\"] direction TB REN[\"Dynamic renderer<br/>Markdown to HTML on demand<br/>no build step\"] NAV[\"Runtime navigation<br/>built live from the hierarchy\"] SUR[\"Surfaces<br/>public site, private mirror<br/>editor, AI chat\"] end subgraph LOOP[\"③ Learning Loop — compound\"] direction TB ENG[\"Self-updating engine<br/>Detect → Assess → Propose → Execute\"] STR[\"Streams — one engine, many domains<br/>article writing, prompt engineering, research\"] TUN[\"TuneIQ — tunes the stack from real sessions\"] COST[\"Cost control — token, context, billing\"] ENG --> STR end META[\"Metadata spine — governs all three layers<br/>folder metadata: label, order, visibility<br/>article dual metadata: identity plus validation<br/>vision metadata: goal, scope, boundaries, principles with rationale\"] SRC --> ENGINE ENGINE -->|governed Markdown| PLAT PLAT -->|traces and corrections| LOOP LOOP -->|keeps fresh, proposes edits| ENGINE META -.-> ENGINE META -.-> PLAT META -.-> LOOP"
        - table [ref=f1e312]:
