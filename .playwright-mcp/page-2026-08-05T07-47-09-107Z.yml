                - strong [ref=f2e321]: ① Platform
              - cell [ref=f2e322]:
                - emphasis [ref=f2e323]: deliver
              - cell [ref=f2e324]:
                - text: A
                - strong [ref=f2e325]: fully dynamic Markdown-rendering application
                - text: that renders Markdown → HTML on demand and builds navigation at runtime —
                - strong [ref=f2e326]: no build step
                - text: ", content is live the moment it lands."
            - row [ref=f2e327]:
              - cell [ref=f2e328]:
                - strong [ref=f2e329]: ② Content Engine
              - cell [ref=f2e330]:
                - emphasis [ref=f2e331]: produce
              - cell [ref=f2e332]:
                - text: The prompts and agents that
                - strong [ref=f2e333]: turn many sources into governed Markdown
                - text: — learning notes, article writing, prompt engineering, and generated reference / documentation / validation content.
            - row [ref=f2e334]:
              - cell [ref=f2e335]:
                - strong [ref=f2e336]: ③ Learning Loop
              - cell [ref=f2e337]:
                - emphasis [ref=f2e338]: compound
              - cell [ref=f2e339]:
                - text: The
                - strong [ref=f2e340]: self-updating engine and autonomous streams
                - text: that keep the corpus fresh and compound the owner's judgment, under human governance.
        - paragraph [ref=f2e341]:
          - text: Two elements in the diagram are
          - strong [ref=f2e342]: not
          - text: "layers — they cut across all three:"
        - list [ref=f2e343]:
          - listitem [ref=f2e344]:
            - strong [ref=f2e345]: Sources
            - text: are the raw material the Content Engine normalises. Feeds, newsletters, conference catalogs, meeting transcripts, papers, and your own corrections all enter the
            - emphasis [ref=f2e346]: same
            - text: pipeline; none of them is a special case with its own bespoke machinery. That generality is the
            - code [ref=f2e347]: generalized-content-engine
            - text: principle.
          - listitem [ref=f2e348]:
            - strong [ref=f2e349]: The metadata spine
            - text: is what makes the Hub governable rather than merely stored. Folder metadata drives navigation, article dual metadata carries identity and validation state, and vision metadata carries the
            - strong [ref=f2e350]: invariants
            - text: —
            - code [ref=f2e351]: goal
            - text: ","
            - code [ref=f2e352]: scope
            - text: ","
            - code [ref=f2e353]: boundaries
            - text: ", and the"
            - code [ref=f2e354]: "principles:"
            - text: block with each principle's priority and rationale. The self-updating engine reads exactly this metadata to decide what it may change. One vocabulary governs navigation, quality tracking, and self-update alike.
        - heading "① Platform — deliver" [level=3] [ref=f2e355]
        - paragraph [ref=f2e356]:
          - text: The Learning Hub is delivered as a
          - strong [ref=f2e357]: fully dynamic Markdown-rendering application
          - text: (
          - code [ref=f2e358]: src/Learn.Web
          - text: ). It renders Markdown → HTML
          - strong [ref=f2e359]: on demand at request time
          - text: and builds its navigation
          - strong [ref=f2e360]: at runtime
          - text: from the live content hierarchy. There is
          - strong [ref=f2e361]: no build step and no static output
          - text: — publishing collapses to
          - emphasis [ref=f2e362]: "\"make the Markdown available.\""
          - text: Content comes from the filesystem (development) or object storage (production), chosen by configuration, so the same application serves a local clone or a hosted corpus without code changes.
        - paragraph [ref=f2e363]:
          - text: Because a page is a pure function of
          - emphasis [ref=f2e364]: its own
          - text: Markdown plus a shared shell, the platform is
          - strong [ref=f2e365]: producer- and source-agnostic
          - text: ": any Markdown, from any origin, renders live. That property is what lets the platform serve audiences far beyond a single learner (see"
          - link "Audiences" [ref=f2e366] [cursor=pointer]:
            - /url: "#-audiences-and-interaction-surfaces"
          - text: and the
          - link "Platform and consumers" [ref=f2e367] [cursor=pointer]:
            - /url: /06.00-idea/learning-hub/04-platform-and-consumers
          - text: chapter).
        - heading "② Content Engine — produce" [level=3] [ref=f2e368]
        - paragraph [ref=f2e369]:
          - text: The Content Engine takes
          - strong [ref=f2e370]: many source channels
          - text: "and normalises them into one pipeline:"
          - strong [ref=f2e371]: feeds and newsletters
          - text: (RSS/Atom, release notes, monitored sites),
          - strong [ref=f2e372]: conference and event material
