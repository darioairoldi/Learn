        - separator [ref=f2e256]
        - heading "🧭 Vision — what it is and why" [level=2] [ref=f2e257]
        - paragraph [ref=f2e258]:
          - text: Most learning is
          - strong [ref=f2e259]: consume-and-forget
          - text: ": you read an article, watch a talk, skim a paper — and the understanding fades. The Learning Hub replaces that with"
          - strong [ref=f2e260]: develop-and-keep
          - text: . It turns the information you meet into a
          - strong [ref=f2e261]: living body of knowledge you own and that keeps getting richer
          - text: ", and pairs it with an AI that learns your goals — so that learning stops being a race to keep up and becomes a way to"
          - strong [ref=f2e262]: think ahead
          - text: .
        - paragraph [ref=f2e263]: "It rests on five moves:"
        - list [ref=f2e264]:
          - listitem [ref=f2e265]:
            - paragraph [ref=f2e266]:
              - strong [ref=f2e267]:
                - mark [ref=f2e268]: Gather
              - text: "— bring what you learn from many sources into one place: feeds, papers, transcripts, event proceedings, and your own notes, normalized into a single corpus."
          - listitem [ref=f2e269]:
            - paragraph [ref=f2e270]:
              - strong [ref=f2e271]:
                - mark [ref=f2e272]: Keep
              - text: — nothing is read once and discarded; every worthwhile piece becomes part of a growing store you control.
          - listitem [ref=f2e273]:
            - paragraph [ref=f2e274]:
              - strong [ref=f2e275]:
                - mark [ref=f2e276]: Enrich
              - text: — with AI's help, each piece is
              - emphasis [ref=f2e277]: developed
              - text: ", not merely stored: analysed, connected to what you already know, organised for clarity, checked for gaps and stale facts, and kept fresh. Learning does not stop at the first read."
          - listitem [ref=f2e278]:
            - paragraph [ref=f2e279]:
              - strong [ref=f2e280]:
                - mark [ref=f2e281]: Learn in context
              - text: — the Hub is a
              - strong [ref=f2e282]: place to learn
              - text: .
              - emphasis [ref=f2e283]: You
              - text: do the active thinking — critical analysis and creative development — while
              - emphasis [ref=f2e284]: AI works alongside you
              - text: ", gathering, curating, developing, and validating. The corpus itself becomes the context that makes both your questions and the AI's help sharper."
          - listitem [ref=f2e285]:
            - paragraph [ref=f2e286]:
              - strong [ref=f2e287]:
                - mark [ref=f2e288]: Think ahead
              - text: — Gathering, keeping, and enriching aren't about a tidy archive; they're about
              - strong [ref=f2e289]: foresight
              - text: . As the corpus grows and the AI learns your goals, your scope, and how you reason, the Hub helps you get
              - emphasis [ref=f2e290]: in front
              - text: "of the flow: it turns fresh news and information into implications for"
              - strong [ref=f2e291]: you
              - text: ", surfaces what matters early, and exposes your"
              - strong [ref=f2e292]: knowledge gaps
              - text: before they bite. Each cycle leaves you thinking further ahead — not just better informed. That compounding foresight is the Learning Hub's core value.
        - paragraph [ref=f2e293]:
          - strong [ref=f2e294]: Why keep it close.
          - text: The judgment you generate while learning — your corrections, your standards, your sense of what "good" looks like — is itself valuable, and by default it flows outward to whoever owns the model you used. The Learning Hub is built so that value stays inside a boundary
          - emphasis [ref=f2e295]: you
          - text: control, free to compound. This economic case —
          - emphasis [ref=f2e296]: own your loop
          - text: — is argued in
          - link "Own your learning loop" [ref=f2e297] [cursor=pointer]:
            - /url: /06.00-idea/learning-hub/05-own-your-learning-loop
          - text: ", which adapts its vocabulary (Control, Capability, Choice, Cost, Compound, and the \"information exhaust\" it keeps) from the"
          - link "Reverse Information Paradox" [ref=f2e298] [cursor=pointer]:
            - /url: /01.00-news/20260716.01-reverse-paradox/overview
          - text: essay. It is the
          - emphasis [ref=f2e299]: rationale
          - text: for owning the Hub — not the whole of what the Hub is.
        - blockquote [ref=f2e300]:
          - paragraph [ref=f2e301]:
            - strong [ref=f2e302]: Nine folders, three layers.
            - text: The sibling folders under
            - link "06.00-idea/" [ref=f2e303] [cursor=pointer]:
              - /url: /_content-raw/06.00-idea
            - text: can read like nine separate projects. They are not — each is a component of one of the three layers described next. The
            - link "map" [ref=f2e304] [cursor=pointer]:
              - /url: "#%EF%B8%8F-the-map--sibling-visions-as-chapters"
            - text: shows which is which.
        - separator [ref=f2e305]
        - heading "🏗️ How it works — one system in three layers" [level=2] [ref=f2e306]
        - paragraph [ref=f2e307]:
          - text: The Learning Hub delivers that vision as
          - strong [ref=f2e308]: one system in three layers
          - text: ", fed by"
          - strong [ref=f2e309]: many sources
          - text: and governed throughout by
          - strong [ref=f2e310]: metadata carried on the content itself
          - text: ":"
        - generic [ref=f2e311]: "flowchart TB PURPOSE[\"Purpose — think ahead<br/>turn what you learn into foresight,<br/>with an AI that understands your goals\"] SRC[\"Sources — what you meet<br/>feeds and newsletters · conferences and events<br/>meetings and talks · papers, reports, vendor docs<br/>your own notes, experiments, corrections\"] subgraph ENGINE[\"② Content Engine — produce\"] direction LR ING[\"Ingest and normalise<br/>extract · dedupe · score relevance\"] --> DEV[\"Develop<br/>analyse · connect · structure by taxonomy\"] --> VAL[\"Validate<br/>claims · references · quality gates\"] end PLAT[\"① Platform — deliver<br/>dynamic renderer, Markdown to HTML on demand, no build step<br/>runtime navigation built from the live hierarchy<br/>surfaces: public site · private mirror · editor · AI chat\"] subgraph LOOP[\"③ Learning Loop — compound\"] direction LR ENG[\"Self-updating engine<br/>Detect → Assess → Propose → Execute<br/>autonomy gradient, human governance\"] --> STR[\"Streams — one engine, many domains<br/>article writing · prompt engineering · research\"] TUN[\"TuneIQ<br/>tunes the stack<br/>from real sessions\"] COST[\"Cost control<br/>token · context · billing\"] end META[\"Metadata spine — governs all three layers<br/>folder metadata: label · order · visibility<br/>article dual metadata: identity + validation tracking<br/>vision metadata: goal · scope · boundaries · principles with rationale\"] PURPOSE -.-> SRC SRC --> ENGINE ENGINE -->|governed Markdown| PLAT PLAT -->|traces and corrections| LOOP LOOP -->|keeps fresh, proposes edits| ENGINE META -.-> ENGINE META -.-> PLAT META -.-> LOOP"
        - table [ref=f2e312]:
          - rowgroup [ref=f2e313]:
            - row [ref=f2e314]:
              - columnheader "Layer" [ref=f2e315]
              - columnheader "Verb" [ref=f2e316]
