<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Hub has moved</title>
  <!-- Accessible redirect: a prominent link/CTA plus a scriptable forward. We avoid
       <meta http-equiv="refresh"> (a timed refresh users cannot pause, WCAG 2.2.1). -->
  <link rel="canonical" href="https://learn-testmc-app-itn-01.azurewebsites.net/">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1f6feb22, transparent), #0d1117;
      color: #e6edf3;
      padding: 2rem;
    }
    main {
      max-width: 40rem;
      text-align: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 40px #0008;
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 0.75rem; line-height: 1.2; }
    p { margin: 0.6rem 0; font-size: 1.05rem; color: #c9d1d9; }
    .tagline { color: #7ee787; font-weight: 600; }
    a.cta {
      display: inline-block;
      margin-top: 1.4rem;
      padding: 0.8rem 1.5rem;
      background: #238636;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    a.cta:hover { background: #2ea043; }
    .url { word-break: break-all; }
    .url a { color: #58a6ff; }
    .hint { margin-top: 1.5rem; font-size: 0.85rem; color: #8b949e; }
  </style>
</head>

<body>
  <main>
    <h1>Learning Hub is now transferred here</h1>
    <p class="url">
      <a href="https://learn-testmc-app-itn-01.azurewebsites.net/">https://learn-testmc-app-itn-01.azurewebsites.net/</a>
    </p>
    <p class="tagline">A fully progressive, self-updating site!</p>
    <p>Please check it out here:</p>
    <a class="cta" href="https://learn-testmc-app-itn-01.azurewebsites.net/">Open the Learning Hub →</a>
    <p class="hint">Redirecting automatically in a few seconds…</p>
  </main>
  <script>
    setTimeout(function () {
      window.location.href = "https://learn-testmc-app-itn-01.azurewebsites.net/";
    }, 4000);
  </script>
</body>

</html>
