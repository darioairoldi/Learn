name: Deploy Learn.Web + Quarto content (v1)

# Two-stage secretless (OIDC) deployment:
#   1. Build & publish the Learn.Web blob-proxy (ASP.NET Core / Kestrel) to the
#      Windows App Service `learn-testmc-app-itn-01`, and point it at the storage account.
#   2. Render the Quarto site and upload the static output to the `learn` container
#      in storage account `samplestmcstitn01`, then flush the proxy cache so the new
#      content is served immediately.
#
# The proxy serves the site by fetching blobs from `samplestmcstitn01/learn` over HTTPS
# (Managed Identity, no keys). See:
#   src/docs/90. Issues/202607/20270714.01-appservice-deploy/kestrel-blob-proxy-analysis.md
#
# Prerequisites (one-time, outside this workflow):
#   - The App Service `learn-testmc-app-itn-01` has a system-assigned managed identity
#     with the "Storage Blob Data Reader" role on `samplestmcstitn01`.
#   - The GitHub OIDC identity (AZURE_CLIENT_ID/TENANT/SUBSCRIPTION secrets) has the
#     "Storage Blob Data Contributor" role on `samplestmcstitn01` (to upload content)
#     and rights to deploy/configure the App Service.
#   - Optional secret LEARN_WEB_INVALIDATE_KEY matches BlobProxy:InvalidateApiKey.

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: the workflow requests a short-lived federated token from GitHub.
permissions:
  id-token: write
  contents: read

# Never run two deploys to the same App Service at once.
concurrency:
  group: azure-webapp-deploy-v1
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: learn-testmc-app-itn-01
  WEBAPP_HOSTNAME: learn-testmc-app-itn-01.azurewebsites.net
  STORAGE_ACCOUNT: samplestmcstitn01
  STORAGE_CONTAINER: learn
  DOTNET_VERSION: "10.0.x"
  QUARTO_VERSION: "1.6.42"

jobs:
  build-and-deploy:
    # Self-hosted Windows runner (GitHub-hosted Actions minutes are disabled).
    runs-on: self-hosted

    steps:
      - name: Reset runner state to main branch
        shell: pwsh
        run: |
          # The gh-pages workflow leaves this self-hosted runner checked out on an
          # orphan deploy branch, which corrupts a plain checkout. Reset to main first.
          if (Test-Path ".git") {
            Write-Host "Resetting runner state to origin/main..."
            git fetch origin main --force
            git checkout -B main origin/main --force
            git clean -fdx
            Write-Host "Runner state reset to origin/main"
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      # ── Stage 1: build & deploy the Learn.Web blob-proxy ──────────────────────

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Learn.Web
        shell: pwsh
        run: |
          # Self-contained win-x64 so the App Service does not need the .NET 10 runtime
          # pre-installed. `dotnet publish` (Web SDK) also emits the ANCM web.config.
          dotnet publish src/Learn.Web/Learn.Web.csproj `
            -c Release -r win-x64 --self-contained true `
            -o publish_learnweb
          if (-not (Test-Path "publish_learnweb/Learn.Web.exe")) {
            Write-Error "publish_learnweb/Learn.Web.exe missing after publish"
            exit 1
          }
          Write-Host "Published Learn.Web to publish_learnweb"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service application settings
        shell: pwsh
        run: |
          # Point the deployed proxy at the storage account. In Azure the external-config
          # folder is not present, so the storage target is supplied as app settings.
          $rg = az webapp list --query "[?name=='$env:AZURE_WEBAPP_NAME'].resourceGroup | [0]" -o tsv
          if (-not $rg) { Write-Error "Could not resolve resource group for $env:AZURE_WEBAPP_NAME"; exit 1 }
          Write-Host "Resource group: $rg"

          $settings = @(
            "BlobProxy__AccountUri=https://$env:STORAGE_ACCOUNT.blob.core.windows.net",
            "BlobProxy__ContainerName=$env:STORAGE_CONTAINER",
            "AppsettingsEnvironmentName=Testmc"
          )
          $invalidateKey = "${{ secrets.LEARN_WEB_INVALIDATE_KEY }}"
          if ($invalidateKey) { $settings += "BlobProxy__InvalidateApiKey=$invalidateKey" }

          az webapp config appsettings set `
            --name $env:AZURE_WEBAPP_NAME --resource-group $rg `
            --settings $settings | Out-Null
          Write-Host "App settings updated"

      - name: Deploy Learn.Web to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish_learnweb

      # ── Stage 2: build the Quarto site & publish it to blob storage ───────────

      - name: Setup Quarto (Windows Self-Hosted)
        shell: pwsh
        run: |
          # Reuse the cached install if present; otherwise install the pinned version.
          $quartoPath = "C:\Program Files\Quarto\bin"
          if (Test-Path "$quartoPath\quarto.exe") {
            $existing = & "$quartoPath\quarto.exe" --version 2>$null
            if ($existing) {
              Write-Host "Quarto already installed: $existing"
              echo $quartoPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              exit 0
            }
          }
          Write-Host "Quarto not found, installing ${env:QUARTO_VERSION}..."
          $quartoUrl = "https://github.com/quarto-dev/quarto-cli/releases/download/v${env:QUARTO_VERSION}/quarto-${env:QUARTO_VERSION}-win.msi"
          Invoke-WebRequest -Uri $quartoUrl -OutFile "quarto-installer.msi" -UseBasicParsing
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "quarto-installer.msi", "/quiet", "/norestart" -Wait
          if (Test-Path "$quartoPath\quarto.exe") {
            echo $quartoPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & "$quartoPath\quarto.exe" --version
          } else {
            Write-Error "Quarto installation failed"
            exit 1
          }

      - name: Verify required Quarto includes
        shell: pwsh
        run: |
          # A missing include silently breaks the theme switcher and fails every
          # nested document, so fail fast here.
          $required = @("header-includes.html", "theme-light.scss", "theme-dark.scss", "styles.css")
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Required Quarto include(s) missing from checkout: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required Quarto includes present"

      - name: Render Quarto site
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .quarto -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force docs -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force _freeze -ErrorAction SilentlyContinue
          quarto render --to html
          if (-not (Test-Path "docs/index.html")) {
            Write-Error "docs/index.html missing after render"
            exit 1
          }
          $count = (Get-ChildItem docs -Filter *.html -Recurse).Count
          Write-Host "Generated $count HTML files"

      - name: Compress images in output
        # Downscale/re-encode large JPEGs in the disposable docs/ artifact only.
        # Runs under Windows PowerShell 5.1 so System.Drawing is available.
        shell: powershell
        run: |
          $before = (Get-ChildItem docs -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          & "$env:GITHUB_WORKSPACE\scripts\compress-images.ps1" -Path docs -MaxDimension 2000 -Quality 82 -MinSizeKB 400
          $after = (Get-ChildItem docs -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Content package: {0:N1} MB -> {1:N1} MB" -f $before, $after)

      - name: Upload Quarto site to blob storage
        shell: pwsh
        run: |
          # Ensure the container exists (Storage Blob Data Contributor allows this),
          # then upload the rendered site. Paths are preserved: docs/index.html -> index.html.
          az storage container create `
            --account-name $env:STORAGE_ACCOUNT --name $env:STORAGE_CONTAINER `
            --auth-mode login --only-show-errors | Out-Null

          az storage blob upload-batch `
            --account-name $env:STORAGE_ACCOUNT --destination $env:STORAGE_CONTAINER `
            --source docs --overwrite true --auth-mode login --only-show-errors | Out-Null
          Write-Host "Uploaded docs/ to $env:STORAGE_ACCOUNT/$env:STORAGE_CONTAINER"

      - name: Fix web-font content types
        shell: pwsh
        run: |
          # az guesses content types from extension, but may not know woff/woff2.
          # Set them explicitly so the browser accepts the fonts.
          $map = @{ ".woff" = "font/woff"; ".woff2" = "font/woff2" }
          $docsRoot = (Resolve-Path "docs").Path
          foreach ($ext in $map.Keys) {
            Get-ChildItem docs -Recurse -File -Filter "*$ext" | ForEach-Object {
              $blob = $_.FullName.Substring($docsRoot.Length + 1).Replace("\", "/")
              az storage blob update `
                --account-name $env:STORAGE_ACCOUNT --container-name $env:STORAGE_CONTAINER `
                --name $blob --content-type $map[$ext] `
                --auth-mode login --only-show-errors | Out-Null
            }
          }
          Write-Host "Web-font content types corrected"

      - name: Invalidate proxy cache
        # Best-effort: flush the proxy's in-memory cache so the new content is served
        # immediately. Non-fatal if the endpoint is gated (e.g. Easy Auth).
        continue-on-error: true
        shell: pwsh
        run: |
          $headers = @{}
          $key = "${{ secrets.LEARN_WEB_INVALIDATE_KEY }}"
          if ($key) { $headers["X-Invalidate-Key"] = $key }
          try {
            Invoke-WebRequest -Uri "https://$env:WEBAPP_HOSTNAME/_cache/invalidate" `
              -Method POST -Headers $headers -TimeoutSec 30 -UseBasicParsing | Out-Null
            Write-Host "Proxy cache flushed"
          } catch {
            Write-Warning "Cache invalidation call failed: $($_.Exception.Message)"
          }

      - name: Azure logout
        if: always()
        shell: pwsh
        run: |
          az logout 2>$null
          exit 0
