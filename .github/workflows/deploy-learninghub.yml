name: Deploy Learning Hub content to storage

# Uploads the Markdown SOURCE (plus images and navigation.json) directly to the `learn`
# container in storage account `digitoolstestmcstitn01`, then flushes the Learn.Web cache.
#
# There is NO Quarto build step: the Learn.Web app renders Markdown to HTML on demand
# (markdown-first). "Publishing" is simply "upload the changed .md" — the storage account
# holds the source of truth and HTML is produced at request time.
#
# Runs when the SITE CONTENT changes (any push that is not solely app code, workflows, or
# deploy stubs — see paths-ignore). The app itself is deployed by deploy-learnweb.yml.
#
# Prerequisites (one-time):
#   - The GitHub OIDC identity (AZURE_CLIENT_ID/TENANT/SUBSCRIPTION secrets) has the
#     "Storage Blob Data Contributor" role on `digitoolstestmcstitn01` (to upload content).
#   - Optional secret LEARN_WEB_INVALIDATE_KEY matches Content:InvalidateApiKey.

on:
  push:
    branches: [main]
    paths-ignore:
      - src/**
      - .github/**
      - deploy/**
  workflow_dispatch:

# OIDC: request a short-lived federated token from GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-learninghub
  cancel-in-progress: false

env:
  WEBAPP_HOSTNAME: learn-testmc-app-itn-01.azurewebsites.net
  STORAGE_ACCOUNT: digitoolstestmcstitn01
  STORAGE_CONTAINER: learn
  # The Azure CLI on the self-hosted runner bundles a 32-bit Python that prints a harmless
  # cryptography UserWarning to stderr on every call; silence it to keep the logs clean.
  PYTHONWARNINGS: ignore

jobs:
  deploy-content:
    runs-on: self-hosted

    steps:
      - name: Reset runner state to main branch
        shell: pwsh
        run: |
          if (Test-Path ".git") {
            git fetch origin main --force
            git checkout -B main origin/main --force
            git clean -fdx
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Stage Markdown content
        shell: pwsh
        run: |
          # Collect the site content (Markdown + images + navigation.json) into a staging
          # folder that mirrors the repo-relative paths the app resolves at runtime, e.g.
          # 01.00-news/x/overview.md and 01.00-news/x/images/*.png.
          #
          # navigation.json is taken as committed in the repo; regenerate it with
          # scripts/generate-navigation.ps1 when the _quarto.yml sidebar changes.
          $stage = "content-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null

          # Content roots: folders that hold only site content (.md/.qmd + images).
          $roots = @(
            "01.00-news", "02.00-events", "03.00-tech", "04.00-howto", "05.00-issues",
            "06.00-idea", "90.00-travel", "99.00-temp",
            "20250815-diy-battery-pack", "20250815-diy-ebike"
          )
          foreach ($r in $roots) {
            if (Test-Path $r) { Copy-Item -Path $r -Destination $stage -Recurse -Force }
          }

          # Root-level content + the generated navigation menu.
          $rootFiles = @("README.md", "getting-started.md", "documentation-index.md", "index.qmd", "navigation.json")
          foreach ($f in $rootFiles) {
            if (Test-Path $f) { Copy-Item -Path $f -Destination $stage -Force }
          }

          $mdCount = (Get-ChildItem $stage -Recurse -File -Include *.md, *.qmd).Count
          $imgCount = (Get-ChildItem $stage -Recurse -File -Include *.png, *.jpg, *.jpeg, *.gif, *.svg, *.webp).Count
          Write-Host "Staged $mdCount markdown files and $imgCount images under $stage"
          if ($mdCount -eq 0) { Write-Error "No markdown staged - aborting"; exit 1 }

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Markdown content to blob storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Ensure the container exists (Storage Blob Data Contributor allows this), then
          # upload the staged content. Paths are preserved:
          # content-stage/01.00-news/x/overview.md -> 01.00-news/x/overview.md.
          az storage container create `
            --account-name $env:STORAGE_ACCOUNT --name $env:STORAGE_CONTAINER `
            --auth-mode login --only-show-errors | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Could not reach/create container '$env:STORAGE_CONTAINER' on '$env:STORAGE_ACCOUNT'. Verify the OIDC identity 'github-learn-deploy' has the 'Storage Blob Data Contributor' role on the account, and that the runner's VPN to the private endpoint is connected (blob endpoint must resolve to a private 10.x IP)."
          }

          az storage blob upload-batch `
            --account-name $env:STORAGE_ACCOUNT --destination $env:STORAGE_CONTAINER `
            --source content-stage --overwrite true --auth-mode login --only-show-errors | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Blob upload to '$env:STORAGE_ACCOUNT/$env:STORAGE_CONTAINER' failed (see errors above)." }

          Write-Host "Uploaded content-stage/ to $env:STORAGE_ACCOUNT/$env:STORAGE_CONTAINER"

      - name: Invalidate app cache
        # Best-effort: flush the app's in-memory cache so new content is served immediately.
        # Non-fatal if the endpoint is absent or gated.
        continue-on-error: true
        shell: pwsh
        run: |
          $headers = @{}
          $key = "${{ secrets.LEARN_WEB_INVALIDATE_KEY }}"
          if ($key) { $headers["X-Invalidate-Key"] = $key }
          try {
            Invoke-WebRequest -Uri "https://$env:WEBAPP_HOSTNAME/_cache/invalidate" `
              -Method POST -Headers $headers -TimeoutSec 30 -UseBasicParsing | Out-Null
            Write-Host "App cache flushed"
          } catch {
            Write-Warning "Cache invalidation call failed: $($_.Exception.Message)"
          }
