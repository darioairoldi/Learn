name: Deploy Learning Hub content to storage

# Renders the Quarto site and uploads the static output to the `learn` container in
# storage account `samplestmcstitn01`, then flushes the Learn.Web proxy cache so the
# new content is served immediately.
#
# Runs when the SITE CONTENT changes (any push that is not solely app code, workflows,
# or deploy stubs — see paths-ignore). The app itself is deployed by deploy-learnweb.yml.
#
# Prerequisites (one-time):
#   - The GitHub OIDC identity (AZURE_CLIENT_ID/TENANT/SUBSCRIPTION secrets) has the
#     "Storage Blob Data Contributor" role on `samplestmcstitn01` (to upload content).
#   - Optional secret LEARN_WEB_INVALIDATE_KEY matches BlobProxy:InvalidateApiKey.

on:
  push:
    branches: [main]
    paths-ignore:
      - src/**
      - .github/**
      - deploy/**
  workflow_dispatch:

# OIDC: request a short-lived federated token from GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-learninghub
  cancel-in-progress: false

env:
  WEBAPP_HOSTNAME: learn-testmc-app-itn-01.azurewebsites.net
  STORAGE_ACCOUNT: samplestmcstitn01
  STORAGE_CONTAINER: learn
  QUARTO_VERSION: "1.6.42"

jobs:
  deploy-content:
    runs-on: self-hosted

    steps:
      - name: Reset runner state to main branch
        shell: pwsh
        run: |
          if (Test-Path ".git") {
            git fetch origin main --force
            git checkout -B main origin/main --force
            git clean -fdx
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Setup Quarto (Windows Self-Hosted)
        shell: pwsh
        run: |
          # Reuse the cached install if present; otherwise install the pinned version.
          $quartoPath = "C:\Program Files\Quarto\bin"
          if (Test-Path "$quartoPath\quarto.exe") {
            $existing = & "$quartoPath\quarto.exe" --version 2>$null
            if ($existing) {
              Write-Host "Quarto already installed: $existing"
              echo $quartoPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              exit 0
            }
          }
          Write-Host "Quarto not found, installing ${env:QUARTO_VERSION}..."
          $quartoUrl = "https://github.com/quarto-dev/quarto-cli/releases/download/v${env:QUARTO_VERSION}/quarto-${env:QUARTO_VERSION}-win.msi"
          Invoke-WebRequest -Uri $quartoUrl -OutFile "quarto-installer.msi" -UseBasicParsing
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "quarto-installer.msi", "/quiet", "/norestart" -Wait
          if (Test-Path "$quartoPath\quarto.exe") {
            echo $quartoPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & "$quartoPath\quarto.exe" --version
          } else {
            Write-Error "Quarto installation failed"
            exit 1
          }

      - name: Verify required Quarto includes
        shell: pwsh
        run: |
          # A missing include silently breaks the theme switcher and fails every
          # nested document, so fail fast here.
          $required = @("header-includes.html", "theme-light.scss", "theme-dark.scss", "styles.css")
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Required Quarto include(s) missing from checkout: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required Quarto includes present"

      - name: Render Quarto site
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .quarto -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force docs -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force _freeze -ErrorAction SilentlyContinue
          quarto render --to html
          if (-not (Test-Path "docs/index.html")) {
            Write-Error "docs/index.html missing after render"
            exit 1
          }
          $count = (Get-ChildItem docs -Filter *.html -Recurse).Count
          Write-Host "Generated $count HTML files"

      - name: Compress images in output
        # Downscale/re-encode large JPEGs in the disposable docs/ artifact only.
        # Runs under Windows PowerShell 5.1 so System.Drawing is available.
        # Override the shell to bypass the machine's Restricted execution policy
        # (the default `shell: powershell` invocation has no -ExecutionPolicy flag,
        # so the runner-generated temp .ps1 is blocked on this self-hosted runner).
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $before = (Get-ChildItem docs -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          & "$env:GITHUB_WORKSPACE\scripts\compress-images.ps1" -Path docs -MaxDimension 2000 -Quality 82 -MinSizeKB 400
          $after = (Get-ChildItem docs -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Content package: {0:N1} MB -> {1:N1} MB" -f $before, $after)

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Learning Hub to blob storage
        shell: pwsh
        run: |
          # Ensure the container exists (Storage Blob Data Contributor allows this),
          # then upload the rendered site. Paths are preserved: docs/index.html -> index.html.
          az storage container create `
            --account-name $env:STORAGE_ACCOUNT --name $env:STORAGE_CONTAINER `
            --auth-mode login --only-show-errors | Out-Null

          az storage blob upload-batch `
            --account-name $env:STORAGE_ACCOUNT --destination $env:STORAGE_CONTAINER `
            --source docs --overwrite true --auth-mode login --only-show-errors | Out-Null
          Write-Host "Uploaded docs/ to $env:STORAGE_ACCOUNT/$env:STORAGE_CONTAINER"

      - name: Fix web-font content types
        shell: pwsh
        run: |
          # az guesses content types from extension, but may not know woff/woff2.
          # Set them explicitly so the browser accepts the fonts.
          $map = @{ ".woff" = "font/woff"; ".woff2" = "font/woff2" }
          $docsRoot = (Resolve-Path "docs").Path
          foreach ($ext in $map.Keys) {
            Get-ChildItem docs -Recurse -File -Filter "*$ext" | ForEach-Object {
              $blob = $_.FullName.Substring($docsRoot.Length + 1).Replace("\", "/")
              az storage blob update `
                --account-name $env:STORAGE_ACCOUNT --container-name $env:STORAGE_CONTAINER `
                --name $blob --content-type $map[$ext] `
                --auth-mode login --only-show-errors | Out-Null
            }
          }
          Write-Host "Web-font content types corrected"

      - name: Invalidate proxy cache
        # Best-effort: flush the proxy's in-memory cache so the new content is served
        # immediately. Non-fatal if the endpoint is gated.
        continue-on-error: true
        shell: pwsh
        run: |
          $headers = @{}
          $key = "${{ secrets.LEARN_WEB_INVALIDATE_KEY }}"
          if ($key) { $headers["X-Invalidate-Key"] = $key }
          try {
            Invoke-WebRequest -Uri "https://$env:WEBAPP_HOSTNAME/_cache/invalidate" `
              -Method POST -Headers $headers -TimeoutSec 30 -UseBasicParsing | Out-Null
            Write-Host "Proxy cache flushed"
          } catch {
            Write-Warning "Cache invalidation call failed: $($_.Exception.Message)"
          }
