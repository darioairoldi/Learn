name: Deploy Learning Hub content to storage

# Resets the `learn` container in storage account `digitoolstestmcstitn01`, then uploads the
# Markdown SOURCE (plus images) directly to it and flushes the Learn.Web cache. The reset makes
# the deployment a full mirror: any folder/article removed from the repo is also removed from
# storage (upload alone never deletes stale blobs).
#
# There is NO Quarto build step: the Learn.Web app renders Markdown to HTML on demand
# (markdown-first). "Publishing" is simply "upload the changed .md" — the storage account
# holds the source of truth and HTML is produced at request time.
#
# Runs when the SITE CONTENT changes (any push that is not solely app code, workflows, or
# deploy stubs — see paths-ignore). The app itself is deployed by deploy-learnweb.yml.
#
# Prerequisites (one-time):
#   - The GitHub OIDC identity (AZURE_CLIENT_ID/TENANT/SUBSCRIPTION secrets) has the
#     "Storage Blob Data Contributor" role on `digitoolstestmcstitn01` (to upload content).
#   - Optional secret LEARN_WEB_INVALIDATE_KEY matches Content:InvalidateApiKey.

on:
  push:
    branches: [main]
    paths-ignore:
      - src/**
      - .github/**
      - deploy/**
  workflow_dispatch:

# OIDC: request a short-lived federated token from GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-learninghub
  cancel-in-progress: false

env:
  WEBAPP_HOSTNAME: learn-testmc-app-itn-01.azurewebsites.net
  STORAGE_ACCOUNT: digitoolstestmcstitn01
  STORAGE_CONTAINER: learn
  # The Azure CLI on the self-hosted runner bundles a 32-bit Python that prints a harmless
  # cryptography UserWarning to stderr on every call; silence it to keep the logs clean.
  PYTHONWARNINGS: ignore

jobs:
  deploy-content:
    runs-on: self-hosted

    steps:
      - name: Reset runner state to main branch
        shell: pwsh
        run: |
          if (Test-Path ".git") {
            git fetch origin main --force
            git checkout -B main origin/main --force
            git clean -fdx
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Stage Markdown content
        shell: pwsh
        run: |
          # Collect the site content (Markdown + images) into a staging folder that mirrors the
          # repo-relative paths the app resolves at runtime, e.g. 01.00-news/x/overview.md and
          # 01.00-news/x/images/*.png. Navigation is built at runtime by the app — nothing to stage.
          $stage = Join-Path $env:RUNNER_TEMP "learn-content-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null

          # Content is every top-level folder and Markdown page at the repo root EXCEPT app code,
          # deployment infrastructure, and tooling. Enumerating (deny-list) instead of maintaining an
          # allow-list means new or renamed content folders (e.g. 85.00-other/, or renamed root pages)
          # deploy automatically and can never drift out of sync with the site. The previous hard-coded
          # list left stale articles in storage and dropped renamed ones from the menu. The app's own
          # nav builder applies the same exclusions (dot/underscore-prefixed and infra folders), so
          # storage mirrors exactly what the site renders.
          $excludeDirs = @("src", "deploy", "scripts", "docs", "AzuriteConfig", "bin", "obj", "node_modules")

          # Top-level content folders: skip infra dirs and any dot/underscore-prefixed working folder.
          # $stage lives at the repo root, so it is itself enumerated here; without excluding it the
          # copy fails with "Cannot overwrite the item ...\content-stage with itself".
          Get-ChildItem -Directory | Where-Object {
            $_.Name -ne $stage -and
            $_.Name -notin $excludeDirs -and $_.Name -notlike ".*" -and $_.Name -notlike "_*"
          } | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force }

          # Sample projects can contain nested build/dependency outputs. They are not site content,
          # and their generated paths can exceed the Windows path limit used by Azure CLI.
          Get-ChildItem $stage -Directory -Recurse | Where-Object {
            $_.Name -in "bin", "obj", "node_modules"
          } | Sort-Object FullName -Descending |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }

          # Top-level content pages (Markdown only; other root files are config/build/licence, not content).
          Get-ChildItem -File | Where-Object { $_.Extension -in ".md", ".qmd" } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage -Force }

          $mdCount = (Get-ChildItem $stage -Recurse -File -Include *.md, *.qmd).Count
          $imgCount = (Get-ChildItem $stage -Recurse -File -Include *.png, *.jpg, *.jpeg, *.gif, *.svg, *.webp).Count
          Write-Host "Staged $mdCount markdown files and $imgCount images under $stage"
          if ($mdCount -eq 0) { Write-Error "No markdown staged - aborting"; exit 1 }

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Synchronize Markdown content to blob storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "learn-content-stage"
          if (-not (Test-Path -LiteralPath $stage -PathType Container)) {
            throw "Staged content directory '$stage' is unavailable; refusing to reset the container."
          }
          Write-Host "Validated upload source '$stage'"

          # Ensure the container exists (Storage Blob Data Contributor allows this), then mirror
          # the staged content into it. Paths are preserved:
          # content-stage/01.00-news/x/overview.md -> 01.00-news/x/overview.md.
          az storage container create `
            --account-name $env:STORAGE_ACCOUNT --name $env:STORAGE_CONTAINER `
            --auth-mode login --only-show-errors | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Could not reach/create container '$env:STORAGE_CONTAINER' on '$env:STORAGE_ACCOUNT'. Verify the OIDC identity 'github-learn-deploy' has the 'Storage Blob Data Contributor' role on the account, and that the runner's VPN to the private endpoint is connected (blob endpoint must resolve to a private 10.x IP)."
          }

          # Upload before pruning so a failed upload leaves the previous site content available.
          az storage blob upload-batch `
            --account-name $env:STORAGE_ACCOUNT --destination $env:STORAGE_CONTAINER `
            --source="$stage" --overwrite true --auth-mode login --only-show-errors | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Blob upload to '$env:STORAGE_ACCOUNT/$env:STORAGE_CONTAINER' failed; existing content was not pruned." }

          # Prune only after a successful upload. This makes cleanup failures non-destructive: the
          # new content remains available, while stale blobs can be removed in a later deployment.
          $stagedBlobNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object {
            $relativePath = [System.IO.Path]::GetRelativePath($stage, $_.FullName) -replace '\\', '/'
            [void]$stagedBlobNames.Add($relativePath)
          }

          $activeJson = az storage blob list `
            --account-name $env:STORAGE_ACCOUNT --container-name $env:STORAGE_CONTAINER `
            --auth-mode login --only-show-errors --output json
          if ($LASTEXITCODE -ne 0) { throw "Failed to list blobs in '$env:STORAGE_CONTAINER' after upload; stale blobs were not pruned." }

          $staleBlobNames = @($activeJson | ConvertFrom-Json | ForEach-Object { $_.name } |
            Where-Object { -not $stagedBlobNames.Contains($_) })
          Write-Host "Pruning $($staleBlobNames.Count) stale blob(s) from '$env:STORAGE_CONTAINER'"
          foreach ($staleBlobName in $staleBlobNames) {
            az storage blob delete `
              --account-name $env:STORAGE_ACCOUNT --container-name $env:STORAGE_CONTAINER `
              --name="$staleBlobName" --auth-mode login --only-show-errors | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale blob '$staleBlobName'; uploaded content remains available." }
          }

          Write-Host "Synchronized $stage to $env:STORAGE_ACCOUNT/$env:STORAGE_CONTAINER"

      - name: Invalidate app cache
        # Best-effort: flush the app's in-memory cache so new content is served immediately.
        # Non-fatal if the endpoint is absent or gated.
        continue-on-error: true
        shell: pwsh
        run: |
          $headers = @{}
          $key = "${{ secrets.LEARN_WEB_INVALIDATE_KEY }}"
          if ($key) { $headers["X-Invalidate-Key"] = $key }
          try {
            Invoke-WebRequest -Uri "https://$env:WEBAPP_HOSTNAME/_nav/invalidate" `
              -Method POST -Headers $headers -TimeoutSec 30 -UseBasicParsing | Out-Null
            Write-Host "App cache flushed"
          } catch {
            Write-Warning "Cache invalidation call failed: $($_.Exception.Message)"
          }
