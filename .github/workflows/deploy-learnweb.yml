name: Deploy Learn.Web (blob-proxy) to App Service

# Builds & publishes the Learn.Web app (ASP.NET Core Blazor Web App) to the
# Windows App Service `learn-testmc-app-itn-01` and points it at the storage account.
# Runs ONLY when the app code changes (see paths filter).
#
# The app serves the Learning Hub by fetching Markdown from `digitoolstestmcstitn01/learn`
# over HTTPS with its managed identity and rendering it on demand. Content itself is
# published by deploy-learninghub.yml.
#
# Prerequisites (one-time):
#   - App Service `learn-testmc-app-itn-01` has a system-assigned managed identity with
#     the "Storage Blob Data Reader" role on `digitoolstestmcstitn01`.
#   - The GitHub OIDC identity (AZURE_CLIENT_ID/TENANT/SUBSCRIPTION secrets) can
#     deploy/configure the App Service.
#   - LEARN_INTERNAL_READ_TOKEN is a fine-grained, read-only token for
#     darioairoldi/Learn.internal (Contents: read).
#   - Optional secret LEARN_WEB_INVALIDATE_KEY matches Content:InvalidateApiKey.

on:
  push:
    branches: [main]
    paths:
      - src/Learn.Web/**
      - src/Learn.Web.Client/**
      - src/Learn.Web.Shared/**
      - src/Directory.Build.props
      - src/Directory.Build.targets
      - nuget.config
      - .github/workflows/deploy-learnweb.yml
  workflow_dispatch:

# OIDC: request a short-lived federated token from GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-learnweb
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: learn-testmc-app-itn-01
  STORAGE_ACCOUNT: digitoolstestmcstitn01
  STORAGE_CONTAINER: learn
  DOTNET_VERSION: "10.0.x"

jobs:
  deploy-app:
    runs-on: self-hosted

    steps:
      - name: Reset runner state to main branch
        shell: pwsh
        run: |
          # The gh-pages / redirect workflows leave the self-hosted runner on an orphan
          # branch, which corrupts a plain checkout. Reset to main first.
          if (Test-Path ".git") {
            git fetch origin main --force
            git checkout -B main origin/main --force
            git clean -fdx
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Checkout Testmc configuration from Learn.internal
        uses: actions/checkout@v4
        with:
          repository: darioairoldi/Learn.internal
          ref: main
          token: ${{ secrets.LEARN_INTERNAL_READ_TOKEN }}
          path: .private/Learn.internal
          sparse-checkout: src/Learn.Web/appsettings.Testmc.json
          sparse-checkout-cone-mode: false

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          # Use the .NET SDK pre-installed on the self-hosted runner. actions/setup-dotnet
          # can't be used here: it tries to install into C:\Program Files\dotnet, which the
          # runner service account cannot write to (the SDK is already installed there).
          $v = dotnet --version
          Write-Host "Using pre-installed .NET SDK: $v"
          if ($LASTEXITCODE -ne 0) { Write-Error "dotnet SDK not available on runner"; exit 1 }
          if (-not ($v -like '10.*')) { Write-Error "Expected .NET 10 SDK, found $v"; exit 1 }

      - name: Publish Learn.Web
        shell: pwsh
        run: |
          # Self-contained so the App Service needs no pre-installed .NET 10 runtime.
          # win-x86 (32-bit) matches the App Service 32-bit worker; a win-x64 build fails
          # to load with "HTTP 500.32 - ANCM Failed to Load dll" (bitness mismatch).
          # If the worker is switched to 64-bit, change this to win-x64.
          dotnet publish src/Learn.Web/Learn.Web.csproj `
            -c Release -r win-x86 --self-contained true `
            -o publish_learnweb
          if (-not (Test-Path "publish_learnweb/Learn.Web.exe")) {
            Write-Error "publish_learnweb/Learn.Web.exe missing after publish"
            exit 1
          }

          # The runner's .NET 10 SDK can create zero-byte Brotli siblings and matching endpoint
          # metadata while the original and gzip assets are valid. Remove only those broken
          # variants from both disk and the endpoint manifest so browsers negotiate gzip/identity.
          $brokenBrotli = @(Get-ChildItem "publish_learnweb/wwwroot/_framework" `
            -File -Recurse -Filter "*.br" | Where-Object Length -eq 0)
          if ($brokenBrotli.Count -gt 0) {
            $manifestPath = "publish_learnweb/Learn.Web.staticwebassets.endpoints.json"
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            $brokenAssetFiles = @($brokenBrotli | ForEach-Object { "_framework/$($_.Name)" })
            $manifest.Endpoints = @($manifest.Endpoints | Where-Object {
              $_.AssetFile -notin $brokenAssetFiles
            })
            $manifest | ConvertTo-Json -Depth 100 -Compress | Set-Content $manifestPath -Encoding utf8NoBOM
            $brokenBrotli | ForEach-Object {
              Write-Host "Removed broken Brotli endpoint: $($_.Name)"
              Remove-Item -LiteralPath $_.FullName -Force
            }
          }

          $emptyFrameworkAssets = @(Get-ChildItem "publish_learnweb/wwwroot/_framework" -File -Recurse |
            Where-Object Length -eq 0)
          if ($emptyFrameworkAssets.Count -gt 0) {
            $emptyFrameworkAssets | ForEach-Object { Write-Error "Empty framework asset: $($_.FullName)" }
            Write-Error "Publish produced $($emptyFrameworkAssets.Count) empty framework assets"
            exit 1
          }

          # ConfigureAppConfiguration2 loads the selected environment overlay from the app's
          # working directory in Azure. Keep Learn.internal authoritative and fail closed if its
          # Testmc file was not checked out or cannot be parsed.
          $testmcSource = ".private/Learn.internal/src/Learn.Web/appsettings.Testmc.json"
          if (-not (Test-Path $testmcSource)) {
            Write-Error "Testmc configuration missing from Learn.internal checkout"
            exit 1
          }
          Get-Content $testmcSource -Raw | ConvertFrom-Json | Out-Null
          Copy-Item $testmcSource "publish_learnweb/appsettings.Testmc.json" -Force
          if (-not (Test-Path "publish_learnweb/appsettings.Testmc.json")) {
            Write-Error "appsettings.Testmc.json missing from publish output"
            exit 1
          }
          Write-Host "Published Learn.Web to publish_learnweb"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service application settings
        shell: pwsh
        env:
          # The Azure CLI on the self-hosted runner bundles a 32-bit Python, which prints a
          # harmless UserWarning ("cryptography on a 32-bit Python ...") to stderr on every
          # invocation. It only affects CLI performance, not correctness, so silence Python
          # warnings to keep the deploy logs clean. Remove this once a 64-bit az CLI is
          # installed on the runner.
          PYTHONWARNINGS: ignore
        run: |
          # AppsettingsEnvironmentName selects the appsettings.Testmc.json copied from
          # Learn.internal into the publish root. Storage settings remain explicit operational
          # overrides so a configuration mismatch cannot point production at the wrong account.
          $rg = az webapp list --query "[?name=='$env:AZURE_WEBAPP_NAME'].resourceGroup | [0]" -o tsv
          if (-not $rg) { Write-Error "Could not resolve resource group for $env:AZURE_WEBAPP_NAME"; exit 1 }
          Write-Host "Resource group: $rg"

          $settings = @(
            "Content__Source=Blob",
            "Content__Blob__AccountUri=https://$env:STORAGE_ACCOUNT.blob.core.windows.net",
            "Content__Blob__ContainerName=$env:STORAGE_CONTAINER",
            "Content__MetricsSnapshotPath=D:\home\data\nav-metrics-snapshot.json",
            "AppsettingsEnvironmentName=Testmc"
          )
          $invalidateKey = "${{ secrets.LEARN_WEB_INVALIDATE_KEY }}"
          if ($invalidateKey) { $settings += "Content__InvalidateApiKey=$invalidateKey" }

          az webapp config appsettings set `
            --name $env:AZURE_WEBAPP_NAME --resource-group $rg `
            --settings $settings | Out-Null
          Write-Host "App settings updated"

      - name: Deploy Learn.Web to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish_learnweb
