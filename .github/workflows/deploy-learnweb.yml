name: Deploy Learn.Web (blob-proxy) to App Service

# Builds & publishes the Learn.Web blob-proxy (ASP.NET Core / Kestrel) to the
# Windows App Service `learn-testmc-app-itn-01` and points it at the storage account.
# Runs ONLY when the app code changes (see paths filter).
#
# The proxy serves the Learning Hub by fetching blobs from `samplestmcstitn01/learn`
# over HTTPS with its managed identity. Content itself is published by
# deploy-learninghub.yml.
#
# Prerequisites (one-time):
#   - App Service `learn-testmc-app-itn-01` has a system-assigned managed identity with
#     the "Storage Blob Data Reader" role on `samplestmcstitn01`.
#   - The GitHub OIDC identity (AZURE_CLIENT_ID/TENANT/SUBSCRIPTION secrets) can
#     deploy/configure the App Service.
#   - Optional secret LEARN_WEB_INVALIDATE_KEY matches BlobProxy:InvalidateApiKey.

on:
  push:
    branches: [main]
    paths:
      - src/Learn.Web/**
      - src/Directory.Build.props
      - src/Directory.Build.targets
      - nuget.config
      - .github/workflows/deploy-learnweb.yml
  workflow_dispatch:

# OIDC: request a short-lived federated token from GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-learnweb
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: learn-testmc-app-itn-01
  STORAGE_ACCOUNT: samplestmcstitn01
  STORAGE_CONTAINER: learn
  DOTNET_VERSION: "10.0.x"

jobs:
  deploy-app:
    runs-on: self-hosted

    steps:
      - name: Reset runner state to main branch
        shell: pwsh
        run: |
          # The gh-pages / redirect workflows leave the self-hosted runner on an orphan
          # branch, which corrupts a plain checkout. Reset to main first.
          if (Test-Path ".git") {
            git fetch origin main --force
            git checkout -B main origin/main --force
            git clean -fdx
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          # Use the .NET SDK pre-installed on the self-hosted runner. actions/setup-dotnet
          # can't be used here: it tries to install into C:\Program Files\dotnet, which the
          # runner service account cannot write to (the SDK is already installed there).
          $v = dotnet --version
          Write-Host "Using pre-installed .NET SDK: $v"
          if ($LASTEXITCODE -ne 0) { Write-Error "dotnet SDK not available on runner"; exit 1 }
          if (-not ($v -like '10.*')) { Write-Error "Expected .NET 10 SDK, found $v"; exit 1 }

      - name: Publish Learn.Web
        shell: pwsh
        run: |
          # Self-contained so the App Service needs no pre-installed .NET 10 runtime.
          # win-x86 (32-bit) matches the App Service 32-bit worker; a win-x64 build fails
          # to load with "HTTP 500.32 - ANCM Failed to Load dll" (bitness mismatch).
          # If the worker is switched to 64-bit, change this to win-x64.
          dotnet publish src/Learn.Web/Learn.Web.csproj `
            -c Release -r win-x86 --self-contained true `
            -o publish_learnweb
          if (-not (Test-Path "publish_learnweb/Learn.Web.exe")) {
            Write-Error "publish_learnweb/Learn.Web.exe missing after publish"
            exit 1
          }
          Write-Host "Published Learn.Web to publish_learnweb"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service application settings
        shell: pwsh
        run: |
          # Point the deployed proxy at the storage account. In Azure the external-config
          # folder is not present, so the storage target is supplied as app settings.
          $rg = az webapp list --query "[?name=='$env:AZURE_WEBAPP_NAME'].resourceGroup | [0]" -o tsv
          if (-not $rg) { Write-Error "Could not resolve resource group for $env:AZURE_WEBAPP_NAME"; exit 1 }
          Write-Host "Resource group: $rg"

          $settings = @(
            "BlobProxy__AccountUri=https://$env:STORAGE_ACCOUNT.blob.core.windows.net",
            "BlobProxy__ContainerName=$env:STORAGE_CONTAINER",
            "AppsettingsEnvironmentName=Testmc"
          )
          $invalidateKey = "${{ secrets.LEARN_WEB_INVALIDATE_KEY }}"
          if ($invalidateKey) { $settings += "BlobProxy__InvalidateApiKey=$invalidateKey" }

          az webapp config appsettings set `
            --name $env:AZURE_WEBAPP_NAME --resource-group $rg `
            --settings $settings | Out-Null
          Write-Host "App settings updated"

      - name: Deploy Learn.Web to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish_learnweb
